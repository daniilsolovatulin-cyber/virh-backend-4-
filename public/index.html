<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вихрь — викторина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260921-9">
</head>
<body>

<div id="app">
  <div id="appHeader"></div>
  <div id="appMain"></div>
</div>

<div class="modal-overlay" id="settingsOverlay" aria-hidden="true">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" tabindex="-1">
    <div class="modal-head">
      <h3 id="settingsTitle">Оформление</h3>
      <button class="icon-btn" id="closeSettings" type="button" aria-label="Закрыть настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="theme-row" id="themeRow">
      <button class="theme-opt" data-theme-choice="light" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Светлая
      </button>
      <button class="theme-opt" data-theme-choice="dark" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        Тёмная
      </button>
      <button class="theme-opt" data-theme-choice="auto" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Системная
      </button>
    </div>
    <p class="settings-note">Вопросы уже включены: сервис использует защищённый ключ на сервере. Ничего вставлять и настраивать не нужно.</p>
  </div>
</div>

<div class="modal-overlay" id="leaveRoomOverlay" aria-hidden="true">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="leaveRoomTitle" tabindex="-1">
    <div class="modal-head">
      <h3 id="leaveRoomTitle">Выйти из лобби?</h3>
      <button class="icon-btn" id="closeLeaveRoomModal" type="button" aria-label="Закрыть диалог">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="field-hint" id="leaveRoomBody" style="margin-bottom:18px;">Если выйдешь, придётся заново вводить код комнаты, чтобы вернуться.</div>
    <div style="display:flex; gap:10px; flex-direction:column;">
      <button class="btn-ghost" id="stayInRoomBtn">Вернуться в лобби</button>
      <button class="btn-primary" id="confirmLeaveRoomBtn" style="background:var(--bad); color:#fff;">Всё равно выйти</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js?v=20260921-9"></script>
<script src="icons.js?v=20260921-9"></script>
<script src="api.js?v=20260921-9"></script>
<script src="sound.js?v=20260921-9"></script>
<script src="app.js?v=20260921-9"></script>
</body>
</html>
